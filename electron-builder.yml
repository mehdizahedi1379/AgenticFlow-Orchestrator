appId: com.nexusagent.windows.harness
productName: NexusAgent Windows Harness
copyright: Copyright © 2026 NexusAgent
directories:
  output: dist_electron
  buildResources: build
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NexusAgent Windows Harness
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
